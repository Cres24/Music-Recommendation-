{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Recommendation System - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141E30,#243B55);
            overflow:hidden;
        }

        .background{
            position:absolute;
            width:100%;
            height:100%;
            overflow:hidden;
        }

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,.05);
            animation:float 8s infinite ease-in-out;
        }

        .circle:nth-child(1){
            width:250px;
            height:250px;
            left:-50px;
            top:-70px;
        }

        .circle:nth-child(2){
            width:180px;
            height:180px;
            right:-40px;
            bottom:60px;
        }

        .circle:nth-child(3){
            width:120px;
            height:120px;
            left:65%;
            top:15%;
        }

        @keyframes float{
            50%{
                transform:translateY(20px);
            }
        }

        .login-card{
            width:420px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:40px;
            box-shadow:0 15px 35px rgba(0,0,0,.4);
            color:white;
            z-index:10;
        }

        .music-icon{
            font-size:70px;
            text-align:center;
            margin-bottom:10px;
        }

        h2{
            text-align:center;
            font-weight:700;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#d6d6d6;
            margin-bottom:30px;
        }

        .form-control{
            height:50px;
            background:rgba(255,255,255,.12);
            border:none;
            color:white;
        }

        .form-control::placeholder{
            color:#dddddd;
        }

        .form-control:focus{
            background:rgba(255,255,255,.15);
            color:white;
            border:none;
            box-shadow:0 0 0 .2rem rgba(0,255,150,.25);
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:30px;
            font-weight:600;
            background:#1DB954;
            color:white;
            transition:.3s;
        }

        .btn-login:hover{
            background:#17a64b;
            transform:translateY(-2px);
        }

        .extra-links{
            text-align:center;
            margin-top:20px;
        }

        .extra-links a{
            color:#1DB954;
            text-decoration:none;
        }

        .extra-links a:hover{
            text-decoration:underline;
        }

        @media(max-width:500px){

            .login-card{
                width:90%;
                padding:30px;
            }

        }

    </style>
</head>
<body>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="login-card">

    <div class="music-icon">
        🎵
    </div>

    <h2>Music Recommendation</h2>

    <p class="subtitle">
        Discover music you'll love
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Username"
                   required>
        </div>

        <div class="mb-3">
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   required>
        </div>

        <button class="btn-login">
            Login
        </button>

    </form>

    <div class="extra-links mt-4">
        Don't have an account?
        <a href="{% url 'register' %}">Create Account</a>
    </div>

</div>

</body>
</html>
