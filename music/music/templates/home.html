{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}

<div class="container-fluid">

    <h2 class="mb-4">
        Good Evening 👋
    </h2>

    <h5 class="mb-3">
        Recommended For You
    </h5>

    <div class="row">

        {% for i in "12345678" %}

        <div class="col-lg-3 col-md-4 col-sm-6 mb-4">

            <div class="card card-dark">

                <img src="https://picsum.photos/300?random={{ forloop.counter }}"
                     class="card-img-top">

                <div class="card-body">

                    <h5>Song {{ forloop.counter }}</h5>

                    <p class="text-secondary">
                        Artist Name
                    </p>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
